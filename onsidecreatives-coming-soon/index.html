<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onside Creatives — Binnenkort online</title>
<meta name="description" content="Onside Creatives: fotografie, video en storytelling uit Leuven. Onze nieuwe website komt eraan.">
<meta name="theme-color" content="#04121e">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:title" content="Onside Creatives — Binnenkort online">
<meta property="og:description" content="Fotografie, video en storytelling uit Leuven.">
<meta property="og:image" content="https://onsidecreatives.be/assets/og-image.jpg">
<meta property="og:url" content="https://onsidecreatives.be/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preload" href="assets/poppins-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" as="image" href="assets/hero-1600.webp" imagesrcset="assets/hero-900.webp 900w, assets/hero-1600.webp 1600w, assets/hero-2340.webp 2340w" imagesizes="100vw">

<style>
  @font-face { font-family: "Poppins"; font-weight: 700; font-display: swap; src: url("assets/poppins-700.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 500; font-display: swap; src: url("assets/inter-500.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; font-display: swap; src: url("assets/inter-600.woff2") format("woff2"); }

  :root {
    --ink: #04121e;
    --sky: #82d7ee;
    --text: #ffffff;
    --muted: rgba(225, 240, 246, .86);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .hero {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    background: radial-gradient(120% 70% at 50% 0%, #03283a 0%, var(--ink) 70%);
  }
  .photo {
    position: relative;
    min-height: 300px;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 22%);
            mask-image: linear-gradient(180deg, transparent 0%, #000 22%);
  }
  .photo picture, .photo img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 54%;
    display: block;
  }
  header {
    width: 100%;
    padding: clamp(40px, 7vh, 72px) 16px 0;
    text-align: center;
    animation: rise .9s cubic-bezier(.2,.7,.2,1) both;
  }
  .kicker {
    display: inline-flex; flex-direction: column; align-items: center; gap: 12px;
    font-weight: 600;
    font-size: clamp(11px, 1.1vw, 13px);
    letter-spacing: .38em;
    color: var(--sky);
    text-transform: uppercase;
    margin: 0 0 clamp(14px, 2vh, 22px);
    padding-left: .38em; /* optically recentre letter-spaced text */
  }
  .kicker::before {
    content: ""; width: 44px; height: 3px; border-radius: 2px; background: var(--sky);
  }
  h1 {
    font-family: "Poppins", "Inter", sans-serif;
    font-weight: 700;
    font-size: clamp(40px, 7.2vw, 96px);
    line-height: 1.02;
    letter-spacing: -.02em;
    margin: 0;
    text-wrap: balance;
  }
  .lead {
    margin: clamp(12px, 1.8vh, 20px) auto 0;
    max-width: 34ch;
    font-size: clamp(16px, 1.6vw, 21px);
    line-height: 1.45;
    color: var(--muted);
  }
  .cta {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: clamp(20px, 3vh, 30px);
    padding: 13px 22px;
    border-radius: 999px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.28);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: background .2s, transform .2s;
  }
  .cta:hover { background: rgba(255,255,255,.22); transform: translateY(-1px); }
  .cta:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }
  .cta svg { width: 18px; height: 18px; flex: none; }

  footer {
    grid-row: 3;
    margin-top: -48px;
    position: relative;
    width: 100%;
    padding: 0 16px 22px;
    display: flex; justify-content: center;
    font-size: 13px;
    color: rgba(4,40,56,.85);
    animation: fade 1.2s .5s both;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { header, footer { animation: none; } }

  @media (max-width: 640px) {
    .photo { min-height: 380px; }
    .photo picture, .photo img { object-position: 50% 50%; }
  }
</style>
</head>
<body>
  <main class="hero">

    <header>
      <p class="kicker">Onside Creatives</p>
      <h1>Binnenkort online.</h1>
      <p class="lead">Fotografie, video en storytelling uit Leuven. Onze nieuwe website is in de maak.</p>
      <a class="cta" href="mailto:info@onsidecreatives.be">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        info@onsidecreatives.be
      </a>
    </header>

    <div class="photo">
      <picture>
        <source type="image/webp" srcset="assets/hero-900.webp 900w, assets/hero-1600.webp 1600w, assets/hero-2340.webp 2340w" sizes="100vw">
        <img src="assets/hero-1600.jpg" srcset="assets/hero-900.jpg 900w, assets/hero-1600.jpg 1600w, assets/hero-2340.jpg 2340w" sizes="100vw"
             alt="Drie sporters springen hoog in de lucht met een golfclub, een basketbal en een tennisracket tegen een blauwe hemel">
      </picture>
    </div>

    <footer><span>© <span id="y">2026</span> Onside Creatives</span></footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
